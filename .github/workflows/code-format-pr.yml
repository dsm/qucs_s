name: code-format-pr

on:
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # gerekli branch işlemleri için

    - name: Set up Git config
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Install clang-format
      run: sudo apt-get update && sudo apt-get install -y clang-format

    - name: Format Qucs files
      run: |
        find . -type f \( -path "./qucs/*" -o -path "./qucs-*/**" \) \
        \( -iname "*.cpp" -o -iname "*.c" -o -iname "*.h" -o -iname "*.hpp" \) \
        -exec clang-format -i {} +

    - name: Check for changes
      id: git-diff
      run: |
        if git diff --quiet; then
          echo "No changes to commit."
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Create PR if changes exist
      if: steps.git-diff.outputs.changed == 'true'
      run: |
        BRANCH_NAME=qucs-format-$(date +%Y%m%d-%H%M%S)
        git checkout -b $BRANCH_NAME
        git add .
        git commit -m "chore: format Qucs-S source files with clang-format"
        git push origin $BRANCH_NAME
        echo "branch_name=$BRANCH_NAME" >> $GITHUB_ENV

    - name: Create Pull Request
      if: steps.git-diff.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        title: "Apply clang-format to Qucs-S sources"
        body: "Automatically formatted code using clang-format."
        head: ${{ env.branch_name }}
        base: develop
